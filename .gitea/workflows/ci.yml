name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Keep in sync with mise.toml
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run check-types

      - run: npm test
